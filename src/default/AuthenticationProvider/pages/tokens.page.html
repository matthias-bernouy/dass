<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes tokens API | Be5</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 700;
        }

        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .logout-link:hover { color: var(--text); }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        tr:last-child td { border-bottom: none; }

        button, select, input {
            font-family: inherit;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.375rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        button:hover { background-color: var(--primary-hover); }

        button.danger { background-color: var(--danger); }
        button.danger:hover { background-color: var(--danger-hover); }

        button.ghost {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        button.ghost:hover { background-color: #0f172a; }

        .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .create-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .create-card h2 {
            margin: 0 0 1rem 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .create-form {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 0.75rem;
            align-items: center;
        }

        .create-form input,
        .create-form select {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: white;
            font-size: 0.875rem;
            box-sizing: border-box;
            margin: 0;
        }

        .create-form button {
            padding: 0.6rem 1.25rem;
            font-size: 0.875rem;
            margin: 0;
        }

        .secret-banner {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .secret-banner h2 {
            margin: 0 0 0.5rem 0;
            font-size: 0.875rem;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .secret-banner p {
            margin: 0 0 0.75rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .secret-row {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }

        .secret-row code {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8rem;
            color: var(--text);
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .secret-row button { margin: 0; }

        .token-name {
            font-weight: 500;
        }

        .token-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .expired-badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            margin-left: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Mes tokens API</h1>
            <a class="logout-link" href="./logout">Déconnexion</a>
        </header>

        <div id="secretBanner"></div>

        <div class="create-card">
            <h2>Nouveau token</h2>
            <form class="create-form" id="createForm">
                <input type="text" id="newName" placeholder="Nom (ex. ci-deploy, mobile-app)">
                <select id="newTtl">
                    <option value="60">1 heure</option>
                    <option value="1440">1 jour</option>
                    <option value="10080">7 jours</option>
                    <option value="43200" selected>30 jours</option>
                    <option value="525600">1 an</option>
                </select>
                <button type="submit">Créer</button>
            </form>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Identifiant</th>
                        <th>Créé le</th>
                        <th>Expire le</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="5" class="empty">Chargement…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tbody = document.getElementById('tbody');
        const banner = document.getElementById('secretBanner');

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showSecret(token, expiresAt) {
            banner.innerHTML = `
                <div class="secret-banner">
                    <h2>Token créé</h2>
                    <p>Copiez-le dès maintenant : il ne sera plus affiché après cette page. Expire le ${new Date(expiresAt).toLocaleString()}.</p>
                    <div class="secret-row">
                        <code id="secretValue">${escapeHtml(token)}</code>
                        <button type="button" class="ghost" id="copyBtn">Copier</button>
                        <button type="button" class="ghost" id="dismissBtn">Masquer</button>
                    </div>
                </div>
            `;
            document.getElementById('copyBtn').addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(token);
                    document.getElementById('copyBtn').textContent = 'Copié ✓';
                } catch {
                    alert('Copie impossible — sélectionnez et copiez manuellement.');
                }
            });
            document.getElementById('dismissBtn').addEventListener('click', () => {
                banner.innerHTML = '';
            });
        }

        async function load() {
            const res = await fetch('./api/tokens');
            if (!res.ok) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">Erreur : ' + res.status + '</td></tr>';
                return;
            }
            const tokens = await res.json();
            if (!tokens.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">Aucun token</td></tr>';
                return;
            }
            const now = Date.now();
            tbody.innerHTML = tokens.map(t => {
                const created = t.createdAt ? new Date(t.createdAt).toLocaleString() : '—';
                const expires = t.expiresAt ? new Date(t.expiresAt).toLocaleString() : '—';
                const expired = t.expiresAt && new Date(t.expiresAt).getTime() <= now;
                const expiredBadge = expired ? '<span class="expired-badge">expiré</span>' : '';
                const name = t.name ? escapeHtml(t.name) : '<span class="token-meta">sans nom</span>';
                return `
                    <tr data-id="${escapeHtml(t.id)}">
                        <td><span class="token-name">${name}</span>${expiredBadge}</td>
                        <td class="token-meta">${escapeHtml(t.id)}</td>
                        <td>${created}</td>
                        <td>${expires}</td>
                        <td><button class="danger delete-btn">Révoquer</button></td>
                    </tr>
                `;
            }).join('');

            tbody.querySelectorAll('tr').forEach(row => {
                const id = row.dataset.id;
                row.querySelector('.delete-btn').addEventListener('click', async () => {
                    if (!confirm('Révoquer ce token ? Cette action est irréversible.')) return;
                    const res = await fetch('./api/tokens', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id }),
                    });
                    if (!res.ok) alert('Erreur : ' + await res.text());
                    else load();
                });
            });
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('newName').value.trim();
            const expiresInMinutes = Number(document.getElementById('newTtl').value);
            const res = await fetch('./api/tokens', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name || undefined, expiresInMinutes }),
            });
            if (!res.ok) {
                alert('Erreur : ' + await res.text());
                return;
            }
            const payload = await res.json();
            document.getElementById('createForm').reset();
            document.getElementById('newTtl').value = '43200';
            showSecret(payload.token, payload.expiresAt);
            load();
        });

        load();
    </script>
</body>

</html>
